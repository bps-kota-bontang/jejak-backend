name: CI/CD Jejak

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build check
        run: go build ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: app
            dockerfile: Dockerfile.app
            image_suffix: jejak-backend
          # - target: worker
          #   dockerfile: Dockerfile.worker
          #   image_suffix: jejak-worker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY_URL }}/${{ secrets.DOCKER_REGISTRY_USERNAME }}/${{ matrix.image_suffix }}:latest
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

