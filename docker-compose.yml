services:
  postgres:
    image: postgres:16-alpine
    container_name: jejak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jejak_db}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-jejak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jejak_network

  redis:
    image: redis:7-alpine
    container_name: jejak-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jejak_network

volumes:
  postgres_data:
  redis_data:

networks:
  jejak_network:
    driver: bridge
